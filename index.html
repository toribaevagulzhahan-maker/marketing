const FIELDS=['igLead','ttLead','mixedLead','otherLead','igEnroll','ttEnroll','mixedEnroll','otherEnroll'];
const CATEGORIES=[['ig','igLead','igEnroll'],['tt','ttLead','ttEnroll'],['mixed','mixedLead','mixedEnroll'],['other','otherLead','otherEnroll']];
function t(k){return I[state.lang]?.[k]??I.kk[k]??k}
function tx(k,vars={}){let s=t(k);for(const [name,value] of Object.entries(vars))s=s.replaceAll('{'+name+'}',value);return s}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return new Intl.NumberFormat(state.lang==='kk'?'kk-KZ':state.lang==='ru'?'ru-RU':'en-US',{maximumFractionDigits:2}).format(Number(n)||0)}
function pct(n){return fmt(Math.round(n*10)/10)+'%'}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0}
function median(arr){if(!arr.length)return 0;const x=[...arr].sort((a,b)=>a-b);return x.length%2?x[(x.length-1)/2]:(x[x.length/2-1]+x[x.length/2])/2}
function stats(){const v=state.videos.map(x=>Number(x.views)||0);return{arr:v,total:v.reduce((a,b)=>a+b,0),avg:avg(v),min:v.length?Math.min(...v):0,max:Math.max(...v,0),median:median(v),groups:[v.filter(x=>x<200).length,v.filter(x=>x>=200&&x<300).length,v.filter(x=>x>=300).length]}}
function monitored(){let sum={},counts={},days=0,any=false;FIELDS.forEach(f=>{sum[f]=0;counts[f]=0});state.monitor.forEach(row=>{let day=false;FIELDS.forEach(f=>{if(row[f]!==''&&row[f]!==null&&row[f]!==undefined){sum[f]+=Math.max(0,Number(row[f])||0);counts[f]++;day=true;any=true}});if(day)days++});const leads=CATEGORIES.reduce((a,c)=>a+sum[c[1]],0),enroll=CATEGORIES.reduce((a,c)=>a+sum[c[2]],0);return{sum,counts,days,any,leads,enroll,rate:leads?enroll/leads*100:null}}
function load(){try{const data=JSON.parse(localStorage.getItem('smm-smart-lab-v3-clean'));if(!data||!Array.isArray(data.videos))return structuredClone(BASE);const b=structuredClone(BASE);return{...b,...data,videos:data.videos.filter(o=>Number.isFinite(Number(o.views))).slice(0,100).map((o,i)=>({id:i+1,views:Math.max(0,Number(o.views))})),monitor:Array.from({length:14},(_,i)=>({...b.monitor[i],...(data.monitor?.[i]||{})})),lang:['kk','ru','en'].includes(data.lang)?data.lang:'kk',page:PAGE_IDS.includes(data.page)?data.page:'overview'}}catch(e){return structuredClone(BASE)}}
function save(){try{localStorage.setItem('smm-smart-lab-v3-clean',JSON.stringify(state))}catch(e){/* Remains usable in memory if browser storage is blocked */}}
function notify(text){const e=document.getElementById('toast');e.textContent=text;e.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>e.classList.remove('show'),2200)}
function humanDate(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return iso;const [y,m,d]=iso.split('-');if(state.lang!=='en')return `${d}.${m}.${y}`;try{return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(iso+'T12:00:00Z'))}catch(e){return iso}}
function addDays(iso,n){const d=new Date((iso||'2026-11-09')+'T12:00:00Z');if(!Number.isFinite(d.getTime()))return iso;d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function head(heading,description,buttons=''){return `<div class="pageIntro"><div><div class="eyebrow">SMM SMART LAB</div><h1>${esc(heading)}</h1><p>${esc(description)}</p></div>${buttons?`<div class="action-row noPrint">${buttons}</div>`:''}</div>`}
function card(title,sub,content){return `<div class="card"><h2 class="cardtitle">${esc(title)}</h2>${sub?`<p class="cardsub">${esc(sub)}</p>`:''}${content}</div>`}
function metric(label,value,sub,ic='chart',style=''){return `<div class="metric"><div class="metricHead"><span class="metricIcon ${style}">${icon(ic)}</span><span class="pill gray">${t('sample')}</span></div><div class="metricLabel">${esc(label)}</div><div class="metricValue">${esc(value)}</div><div class="metricSub">${esc(sub)}</div></div>`}
function followChart(){const max=Math.max(1,state.igFollowers,state.ttFollowers);return `<div class="barChart"><div class="barRow"><span class="label">Instagram</span><div class="track"><div class="fill" style="width:${state.igFollowers/max*100}%"></div></div><span class="num">${fmt(state.igFollowers)}</span></div><div class="barRow"><span class="label">TikTok</span><div class="track"><div class="fill pink" style="width:${state.ttFollowers/max*100}%"></div></div><span class="num">${fmt(state.ttFollowers)}</span></div></div><div class="chartFoot">${esc(t('dataCaution'))}</div>`}
function hist(){const s=stats(),labels=['under200','from200to299','above299'];const max=Math.max(1,...s.groups);return `<div class="histArea"><div class="hist">${s.groups.map((val,i)=>`<div class="histItem"><span class="histValue">${fmt(val)}</span><div class="histBar ${i===1?'pink':''}" style="height:${Math.max(3,val/max*138)}px"></div></div>`).join('')}</div><div style="display:flex;justify-content:space-around;gap:12px;">${labels.map(k=>`<div class="histLabel" style="flex:1">${t(k)}</div>`).join('')}</div></div><div class="chartFoot">${fmt(s.arr.length)} ${t('videosCount')} · ${t('avgViews')}: <strong>${fmt(s.avg)}</strong></div>`}
function statList(){const s=stats();return `<div class="statsList">${[['totalViews',fmt(s.total)],['avgViews',fmt(s.avg)],['maxViews',fmt(s.max)],['minViews',fmt(s.arr.length?Math.min(...s.arr):0)],['medianViews',fmt(s.median)]].map(([k,v])=>`<div class="statsItem"><span>${t(k)}</span><strong>${v}</strong></div>`).join('')}</div>`}
function insight(title,desc,num){return `<div class="insight"><div class="bullet">${num}</div><div><strong>${esc(title)}</strong><p>${esc(desc)}</p></div></div>`}
function note(txt,warning=false){return `<div class="notice ${warning?'warn':''}">${esc(txt)}</div>`}
function overview(){const s=stats();return head(t('overview'),`${t('sampleStats')} · ${esc(state.business)} · ${humanDate(state.snapshot)}`,`<button class="btn primary" data-nav="report">${icon('report')}${t('report')}</button>`) + `<div class="hero"><div><span class="spark">${t('realData')}</span><h2>${t('cover')}</h2><p>${t('heroDesc')}</p></div><div class="heroGraphic"><span class="rise">↗</span>${[41,64,89,115,145].map(h=>`<div class="hbar" style="height:${h}px"></div>`).join('')}</div></div><div class="metrics">${metric(t('igFollowers'),fmt(state.igFollowers),t('fromSnapshot'),'users')}${metric(t('ttFollowers'),fmt(state.ttFollowers),t('fromSnapshot'),'users','pink')}${metric(t('avgViews'),fmt(s.avg),t('videosFrom'),'chart','green')}${metric(t('videosAnalyzed'),fmt(s.arr.length),t('videosFrom'),'videos','blue')}</div><div class="grid2">${card(t('compareTitle'),t('compareHint'),followChart())}${card(t('distribution'),t('distributionHint'),hist())}</div><div class="sectionHeading"><h2>${t('focusInsights')}</h2></div><div class="grid63">${card(t('focusInsights'),'',`<div class="insights">${insight(t('insight1'),tx('insight1Desc',{x:fmt(state.igPosts)}),'01')}${insight(t('insight2'),tx('insight2Desc',{x:fmt(s.avg),y:fmt(s.max)}),'02')}${insight(t('insight3'),t('insight3Desc'),'03')}</div>`)}${card(t('summary'),t('snap'),statList())}</div>`}
function accRow(platform,handle,value,cl){return `<div class="accountRow"><span class="sourceIcon ${cl}">${platform==='Instagram'?'◎':'♪'}</span><div style="flex:1"><div class="handle">@${esc(handle)}</div><div class="follow">${platform}</div></div><div class="num">${fmt(value)} <span class="smallnote">${t('followers')}</span></div></div>`}
function compare(){const ratio=state.ttFollowers?state.igFollowers/state.ttFollowers:null;return head(t('compare'),t('compareIntro'))+`<div class="grid2">${card(t('igDetails'),'',accRow('Instagram',state.instagram,state.igFollowers,'ig')+`<div class="statsList"><div class="statsItem"><span>${t('publications')}</span><strong>${fmt(state.igPosts)}</strong></div><div class="statsItem"><span>${t('following')}</span><strong>${fmt(state.igFollowing)}</strong></div></div>`)}${card(t('ttDetails'),'',accRow('TikTok',state.tiktok,state.ttFollowers,'tt')+`<div class="statsList"><div class="statsItem"><span>${t('profileLikes')}</span><strong>${fmt(state.ttLikes)}</strong></div><div class="statsItem"><span>${t('following')}</span><strong>${fmt(state.ttFollowing)}</strong></div></div>`)}</div><div class="sectionHeading"><h2>${t('compareTable')}</h2></div>${card(t('compareTitle'),t('compareHint'),followChart()+`<div class="tableWrap"><table><thead><tr><th>${t('indicator')}</th><th>Instagram</th><th>TikTok</th></tr></thead><tbody><tr><td>${t('followers')}</td><td class="num">${fmt(state.igFollowers)}</td><td class="num">${fmt(state.ttFollowers)}</td></tr><tr><td>${t('following')}</td><td class="num">${fmt(state.igFollowing)}</td><td class="num">${fmt(state.ttFollowing)}</td></tr></tbody></table></div>`)}<div class="sectionHeading"><h2>${t('compareCalc')}</h2></div><div class="metrics" style="grid-template-columns:repeat(2,minmax(0,1fr))">${metric(t('compareDifference'),fmt(Math.abs(state.igFollowers-state.ttFollowers)),t('followers'),'compare')}${metric(t('compareRatio'),ratio!==null?fmt(ratio)+' '+t('times'):'—',t('followersRatio'),'chart','pink')}</div>${note(t('compareNote'),true)}`}
function videoBars(){const s=stats(),max=Math.max(1,...s.arr);return `<div class="videoChart">${s.arr.map((x,i)=>`<div class="videoBarBox" title="${esc(t('videoNum'))} ${i+1}: ${fmt(x)} ${esc(t('views'))}"><div class="videoBar ${x===s.max?'high':''}" style="height:${Math.max(3,Math.round(x/max*205))}px"></div><span>${i+1}</span></div>`).join('')}</div><div class="videoChartLabels">${t('videoNum')} 1–${s.arr.length} · ${t('maxViews')}: ${fmt(s.max)}</div>`}
function videos(){const s=stats();return head(t('videos'),t('videoIntro'),`<button class="btn primary" data-act="addVideo">${icon('plus')}${t('addVideo')}</button><button class="btn" data-act="resetVideos">${icon('restore')}${t('resetVideos')}</button>`)+`<div class="metrics">${metric(t('videosAnalyzed'),fmt(s.arr.length),t('videosFrom'),'videos')}${metric(t('totalViews'),fmt(s.total),t('sampleStats'),'chart','pink')}${metric(t('avgViews'),fmt(s.avg),t('sampleStats'),'chart','green')}${metric(t('maxViews'),fmt(s.max),t('sampleStats'),'chart','blue')}</div>${card(t('videoBars'),t('distributionHint'),videoBars())}<div class="sectionHeading"><h2>${t('videoTable')}</h2><span class="pill purple">${t('savedAuto')}</span></div>${card(t('editVideo'),'',`<div class="tableWrap"><table><thead><tr><th>${t('videoNum')}</th><th>${t('views')}</th><th></th></tr></thead><tbody>${state.videos.map((v,i)=>`<tr><td>${i+1}</td><td><input type="number" min="0" step="1" inputmode="numeric" class="tableInput" data-video="${i}" aria-label="${esc(t('views'))} ${i+1}" value="${Number(v.views)}"></td><td><button class="btn small danger" data-act="deleteVideo" data-index="${i}" title="${esc(t('remove'))}" aria-label="${esc(t('remove'))} ${i+1}">${icon('trash')}</button></td></tr>`).join('')}</tbody></table></div><div class="inputHint">${t('savedAuto')}</div>`)}${note(t('videoCaution'),true)}`}
function monitorSummary(){const m=monitored();const rate=m.rate===null?'—':pct(m.rate);return `<div class="metrics">${metric(t('monitorDays'),`${m.days}/14`,t('effective'),'calendar')}${metric(t('allLeads'),m.any?fmt(m.leads):'—',t('effective'),'users','pink')}${metric(t('allEnroll'),m.any?fmt(m.enroll):'—',t('effective'),'check','green')}${metric(t('overallRate'),m.any?rate:'—',t('monitorMethod'),'chart','blue')}</div>`}
function monitorSrc(){const m=monitored();return `<div class="tableWrap"><table><thead><tr><th>${t('source')}</th><th class="center">${t('leads')}</th><th class="center">${t('enrollments')}</th><th class="center">${t('conversion')}</th></tr></thead><tbody>${CATEGORIES.map(([key,l,e])=>{const present=m.counts[l]>0||m.counts[e]>0;return `<tr><td><strong>${t(key)}</strong></td><td class="center num">${m.counts[l]?fmt(m.sum[l]):'—'}</td><td class="center num">${m.counts[e]?fmt(m.sum[e]):'—'}</td><td class="center num">${m.counts[l]&&m.counts[e]&&m.sum[l]?pct(m.sum[e]/m.sum[l]*100):'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function monitorTable(){return `<div class="tableWrap"><table style="min-width:1000px"><thead><tr><th rowspan="2">${t('day')}</th><th rowspan="2">${t('date')}</th><th colspan="4" class="center">${t('leadGroup')}</th><th colspan="4" class="center">${t('enrollGroup')}</th></tr><tr>${['ig','tt','mixed','other','ig','tt','mixed','other'].map(k=>`<th class="center">${t(k)}</th>`).join('')}</tr></thead><tbody>${state.monitor.map((r,i)=>`<tr><td class="num center">${i+1}</td><td style="white-space:nowrap">${humanDate(addDays(state.startDate,i))}</td>${FIELDS.map(f=>`<td class="center"><input class="tableInput monitorInput" type="number" min="0" step="1" inputmode="numeric" aria-label="${i+1} ${esc(f)}" data-monitor-row="${i}" data-monitor-field="${f}" value="${esc(r[f])}" placeholder="—"/></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function monitor(){const m=monitored();return head(t('monitor'),t('monitorIntro'),`<button class="btn" data-act="csv">${icon('download')}${t('downloadCSV')}</button>`)+`<div class="card" style="margin-bottom:18px"><div class="formline"><div class="field" style="width:185px"><label for="startDate">${t('startDate')}</label><input id="startDate" type="date" data-field="startDate" value="${esc(state.startDate)}"/></div><label style="display:flex;align-items:center;gap:9px;font-size:12px;margin-top:20px"><input type="checkbox" data-field="permission" ${state.permission?'checked':''} style="accent-color:var(--violet);width:17px;height:17px">${t('permission')}</label></div><div class="smallnote" style="margin-top:8px">${t('permissionNote')}</div></div>${monitorSummary()}<div class="grid2"><div>${card(t('bySource'),'',monitorSrc())}</div><div>${m.any?card(t('monitorMethod'),t('monitorMethodDesc'),statList()) :`<div class="empty">${icon('calendar')}<h3>${t('noMonitor')}</h3><p>${t('noMonitorDesc')}</p></div>`}</div></div><div class="sectionHeading"><h2>${t('monitorTable')}</h2><span class="pill">${t('savedAuto')}</span></div>${card(t('monitorTable'),'',monitorTable())}${note(t('monitorNote'),true)}<div class="inputHint">${t('monitorMethodDesc')}</div>`}
function recommendations(){const m=monitored(),s=stats();let recs=[['r1','r1d','users'],['r2','r2d','videos'],['r3','r3d','monitor'],['r4','r4d','shield'],['r5','r5d','chart']];recs.push(m.any?['r7','r7d','check']:['r6','r6d','calendar']);return head(t('recommendations'),t('recommendIntro'))+`<div class="grid2"><div>${recs.slice(0,3).map(([h,d,i])=>`<div class="recommend"><span class="recommendIcon">${icon(i)}</span><div><h3>${t(h)}</h3><p>${d==='r5d'?tx(d,{x:fmt(s.max)}):t(d)}</p></div></div>`).join('')}</div><div>${recs.slice(3).map(([h,d,i])=>`<div class="recommend"><span class="recommendIcon">${icon(i)}</span><div><h3>${t(h)}</h3><p>${d==='r5d'?tx(d,{x:fmt(s.max)}):t(d)}</p></div></div>`).join('')}</div></div>${note(t('dataCaution'))}`}
function report(){const s=stats(),m=monitored();return head(t('report'),t('reportIntro'),`<button class="btn primary" data-act="print">${icon('printer')}${t('print')}</button><button class="btn" data-act="csv">${icon('download')}${t('downloadCSV')}</button><button class="btn" data-act="json">${icon('download')}${t('backup')}</button>`)+`<article class="card printable"><div class="reportText"><div class="eyebrow">SMM SMART LAB</div><h1>${t('reportTitle')}</h1><p><strong>${t('researchTitle')}</strong></p><p><strong>${t('case')}:</strong> ${esc(state.business)}<br><strong>${t('reportDate')}:</strong> ${humanDate(state.snapshot)}<br><strong>${t('accounts')}:</strong> Instagram @${esc(state.instagram)}; TikTok @${esc(state.tiktok)}</p><h3>${t('reportBase')}</h3><table class="reportTable"><thead><tr><th>${t('indicator')}</th><th>Instagram</th><th>TikTok</th></tr></thead><tbody><tr><td>${t('followers')}</td><td>${fmt(state.igFollowers)}</td><td>${fmt(state.ttFollowers)}</td></tr><tr><td>${t('following')}</td><td>${fmt(state.igFollowing)}</td><td>${fmt(state.ttFollowing)}</td></tr></tbody></table><p style="margin-top:9px">${t('publications')} Instagram: ${fmt(state.igPosts)}. ${t('profileLikes')} TikTok: ${fmt(state.ttLikes)}.</p><h3>${t('reportVideos')}</h3><table class="reportTable"><tbody><tr><td>${t('videosAnalyzed')}</td><td class="num">${fmt(s.arr.length)}</td></tr><tr><td>${t('totalViews')}</td><td class="num">${fmt(s.total)}</td></tr><tr><td>${t('avgViews')}</td><td class="num">${fmt(s.avg)}</td></tr><tr><td>${t('medianViews')}</td><td class="num">${fmt(s.median)}</td></tr><tr><td>${t('maxViews')}</td><td class="num">${fmt(s.max)}</td></tr><tr><td>${t('minViews')}</td><td class="num">${fmt(s.arr.length?Math.min(...s.arr):0)}</td></tr></tbody></table><div style="margin-top:17px">${hist()}</div><h3>${t('reportMonitor')}</h3>${m.any?`<p>${t('monitorDays')}: ${m.days}/14. ${t('allLeads')}: ${fmt(m.leads)}. ${t('allEnroll')}: ${fmt(m.enroll)}. ${t('overallRate')}: ${m.rate===null?'—':pct(m.rate)}.</p>${monitorSrc()}`:`<p>${t('reportPending')}</p>`}<h3>${t('reportConcl')}</h3><p>${t('reportConclText')}</p><p class="smallnote">${t('reportSource')}</p></div></article>`}
function fieldInput(key,label,typ='text',extra=''){return `<div class="field"><label for="set-${key}">${esc(label)}</label><input id="set-${key}" data-field="${key}" type="${typ}" ${typ==='number'?'min="0" step="1"':''} value="${esc(state[key])}" ${extra}/></div>`}
function settings(){return head(t('settings'),t('settingsIntro'),`<button class="btn" data-act="json">${icon('download')}${t('backup')}</button><button class="btn" data-act="import">${icon('upload')}${t('import')}</button>`)+`<div class="card"><h2 class="cardtitle">${t('case')}</h2><div class="fieldset">${fieldInput('business',t('business'))}${fieldInput('instagram',t('igHandle'))}${fieldInput('tiktok',t('ttHandle'))}${fieldInput('snapshot',t('snapshotDate'),'date')}</div><h2 class="cardtitle" style="margin:22px 0 15px">${t('effective')}</h2><div class="fieldset">${fieldInput('igFollowers',t('igCount'),'number')}${fieldInput('ttFollowers',t('ttCount'),'number')}${fieldInput('igPosts',t('igPostCount'),'number')}${fieldInput('igFollowing',t('igFollowingCount'),'number')}${fieldInput('ttFollowing',t('ttFollowingCount'),'number')}${fieldInput('ttLikes',t('ttLikesCount'),'number')}</div><div class="inputHint">${t('savedAuto')}</div></div><div class="sectionHeading"><h2>${t('settingsPrivacy')}</h2></div><div class="card"><p class="cardsub">${t('settingsPrivacyDesc')}</p><div class="action-row"><button class="btn" data-act="json">${icon('download')}${t('backup')}</button><button class="btn" data-act="import">${icon('upload')}${t('import')}</button><button class="btn danger" data-act="resetAll">${icon('restore')}${t('resetAll')}</button></div></div>`}
function render(){document.documentElement.lang=state.lang;document.body.classList.toggle('dark',!!state.dark);const nav=PAGE_IDS.map(p=>`<button data-nav="${p}" class="${state.page===p?'active':''}" title="${esc(t(p))}" aria-label="${esc(t(p))}">${icon(p)}<span>${t(p)}</span></button>`).join('');const view={overview,compare,videos,monitor,recommendations,report,settings}[state.page]();document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brandMark">${icon('logo')}</div><div><div class="brandname">SMM SMART LAB</div><div class="brandsub">${t('navsub')}</div></div></div><div class="nav-label">${t('menu')}</div><nav class="nav">${nav}</nav><div class="sideBottom"><strong><span class="dot"></span>${t('offline')}</strong><p>${t('offlineDesc')}</p></div></aside><div class="main"><header class="topbar"><div><div class="bread">SMM SMART LAB</div><div class="pagehead">${esc(t(state.page))}</div></div><div class="topControls"><div class="lang" role="group" aria-label="Language"><button data-lang="kk" class="${state.lang==='kk'?'selected':''}">ҚАЗ</button><button data-lang="ru" class="${state.lang==='ru'?'selected':''}">РУС</button><button data-lang="en" class="${state.lang==='en'?'selected':''}">ENG</button></div><button class="iconBtn" data-act="theme" aria-label="Theme" title="Theme">${icon(state.dark?'sun':'moon')}</button></div></header><main class="content">${view}<div class="footer"><span>© 2026 SMM SMART LAB · ${t('researchTitle')}</span><span>${t('offline')}</span></div></main></div></div><input type="file" id="jsonFile" accept="application/json,.json" class="fileInput"/>`;save();}
function CSVCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);notify(t('downloaded'))}
function exportCSV(){const headers=['date','instagram_inquiries','tiktok_inquiries','both_inquiries','other_inquiries','instagram_enrollments','tiktok_enrollments','both_enrollments','other_enrollments'];const rows=state.monitor.map((r,i)=>[addDays(state.startDate,i),...FIELDS.map(f=>r[f])]);const csv='\ufeff'+[headers,...rows].map(r=>r.map(CSVCell).join(',')).join('\r\n');download('SMM_SMART_LAB_14_days.csv',csv,'text/csv;charset=utf-8');if(!monitored().any)notify(t('csvEmpty'))}
function applyField(el){const key=el.dataset.field;if(!(key in state))return;if(key==='permission'){state.permission=el.checked}else if(el.type==='number'){const v=Number(el.value);if(!Number.isFinite(v)||v<0){notify(t('invalid'));return}state[key]=Math.floor(v)}else{state[key]=el.value}save();if(key!=='permission')render();else notify(t('saved'))}
function changeMonitor(el){const row=Number(el.dataset.monitorRow),key=el.dataset.monitorField;if(!Number.isInteger(row)||row<0||row>13||!FIELDS.includes(key))return;const v=el.value.trim();if(v!==''&&(!/^\d+$/.test(v)||Number(v)>1000000000)){notify(t('invalid'));return}state.monitor[row][key]=v===''?'':Number(v);save();render()}
function action(name,element){switch(name){case 'theme':state.dark=!state.dark;render();break;case 'addVideo':{const next=Math.max(...state.videos.map(v=>v.id),0)+1;state.videos.push({id:next,views:0});render();break;}case 'deleteVideo':{const i=Number(element.dataset.index);state.videos.splice(i,1);state.videos.forEach((v,j)=>v.id=j+1);render();break;}case 'resetVideos':state.videos=INIT_VIEWS.map((views,i)=>({id:i+1,views}));render();break;case 'resetAll':if(confirm(t('resetConfirm'))){const oldLang=state.lang,oldDark=state.dark;state=structuredClone(BASE);state.lang=oldLang;state.dark=oldDark;state.page='settings';render()}break;case 'csv':exportCSV();break;case 'json':download('SMM_SMART_LAB_backup.json',JSON.stringify({...state,format:'smm-smart-lab-v3-clean'},null,2),'application/json;charset=utf-8');break;case 'import':document.getElementById('jsonFile').click();break;case 'print':window.print();break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-lang],[data-nav],[data-act]');if(!el)return;if(el.dataset.lang){state.lang=el.dataset.lang;render();return}if(el.dataset.nav){state.page=el.dataset.nav;render();window.scrollTo({top:0,behavior:'instant'});return}if(el.dataset.act){action(el.dataset.act,el);return}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-monitor-row]')){changeMonitor(el);return}if(el.matches('[data-video]')){const i=Number(el.dataset.video),v=Number(el.value);if(!Number.isInteger(v)||v<0||v>1000000000){notify(t('invalid'));return}state.videos[i].views=v;render();return}if(el.matches('[data-field]')){applyField(el);return}if(el.matches('#jsonFile')){const f=el.files?.[0];if(!f)return;f.text().then(text=>{try{const x=JSON.parse(text);if(!x||!Array.isArray(x.videos)||!Array.isArray(x.monitor))throw new Error('format');localStorage.setItem('smm-smart-lab-v3-clean',JSON.stringify(x));state=load();render();notify(t('importSuccess'))}catch(err){notify(t('importFail'))}})}});
render();
})();
</script>
</body>
</html>
